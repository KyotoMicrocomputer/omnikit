[package]
name = "omni_api_rs"
# TODO: Migrate to Rust 2024 when gir tool supports it
edition = "2021"

[features]
default = ["_internal_generate"]

# Internal feature to enable code generation in `build.rs`
_internal_generate = []

[dependencies]
ffi = { package = "omni_api_sys", path = "./sys" }
glib = { workspace = true }
gio = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }

[build-dependencies]
omni_api_build = { workspace = true }

[lints]
workspace = true
